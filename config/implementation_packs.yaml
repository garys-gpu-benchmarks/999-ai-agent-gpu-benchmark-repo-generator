# Workload slot 1-32 → component directory ids (comma-separated).
# This yaml is the only pack map. BenchmarkSpecDefinitions.xlsx has no
# Implementation Pack column.
# Slot N maps to workloads 100+N (24.04 AMD), 200+N (24.04 NVIDIA),
# 300+N (26.04 AMD), and 400+N (26.04 NVIDIA).
# Mixins (harness-self-check, rocblas-clients-build, rocm-tool-verify-build)
# still apply via apply_when and are not listed here.
packs:
  1:
    amd: system-config-amd
    nvidia: system-config-nvidia
  2:
    amd: rocm-health-amd
    nvidia: gpu-health-nvidia
